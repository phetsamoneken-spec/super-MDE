<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Super MDE</title>
    <meta name="description" content="Mobile-first Sales Promotion Tracking, Store Order Management, and To-Do List PWA with bilingual Lao-English support, Excel import/export, and offline drafts." />
    
    <!-- OpenGraph / Social -->
    <meta property="og:title" content="Super MDE" />
    <meta property="og:description" content="Mobile-first Sales Promotion Tracking, Store Order Management, and To-Do List PWA with bilingual Lao-English support, Excel import/export, and offline drafts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA / Mobile Capable -->
    <meta name="theme-color" content="#146c4b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Super MDE" />
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/super-mde-32-v1.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/super-mde-192-v1.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/super-mde-180-v1.png" />

    <!-- Lao font is hosted locally; Inter supplies the English glyphs. -->
    <link rel="preload" href="%BASE_URL%fonts/noto-sans-lao-v33-lao.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--color-bg)] text-[var(--color-text-primary)] antialiased selection:bg-emerald-500 selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
